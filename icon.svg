<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="#0f766e"/>
  
  <!-- Clock circle -->
  <circle cx="220" cy="220" r="130" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Clock hands -->
  <path d="M 220 220 L 140 220 M 220 220 L 220 140" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  <circle cx="220" cy="220" r="18" fill="#ffffff"/>
  
  <!-- Warning Triangle cutout background (separates the clock from the triangle) -->
  <path d="M 370 260 L 460 420 L 280 420 Z" fill="#0f766e" stroke="#0f766e" stroke-width="40" stroke-linejoin="round"/>
  
  <!-- Warning Triangle (white) -->
  <path d="M 370 260 L 460 420 L 280 420 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Exclamation Mark -->
  <path d="M 370 310 L 370 360" stroke="#0f766e" stroke-width="22" stroke-linecap="round"/>
  <circle cx="370" cy="390" r="12" fill="#0f766e"/>
</svg>